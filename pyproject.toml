[project]
name = "deepresearch-agent"
version = "0.1.0"
description = "Multi-agent deep research assistant built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain>=1.4,<2",
    "langchain-openai>=1.7,<2",
    "python-dotenv>=1.0",
    "qdrant-client>=1.19,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
postgres = ["langgraph-checkpoint-postgres>=3.2,<4", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
